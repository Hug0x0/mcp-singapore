name: Bug report
description: Report reproducible unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, expected result, and actual result
      description: Include the version, tool, and arguments without credentials.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and coverage
      description: Include official URLs, coverage dates, pages, or sample limitations.
  - type: textarea
    id: validation
    attributes:
      label: Diagnostic information
      description: Include sanitized error messages and the Node/MCP client environment. Do not include secrets.
