name: Feature request
description: Propose a capability or a new data source
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need and example question
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, official source, and acceptance criteria
      description: Specify pagination, units, credential requirements, and known limitations.
    validations:
      required: true
